name: SSH Test  # Название workflow, которое будет отображаться в интерфейсе GitHub Actions

on:  # События, при которых запускается workflow
  push:  # При пуше (отправке кода) в репозиторий
    branches: [main]  # Только когда пуш происходит в ветку main

jobs:  # Задачи, которые будут выполняться
  test:  # Название задачи
    runs-on: ubuntu-latest  # Виртуальная машина, на которой всё выполняется (Ubuntu последней версии)
    
    steps:  # Последовательность шагов внутри задачи
      - uses: actions/checkout@v4  # Клонирует ваш репозиторий на виртуальную машину GitHub
      
      - name: Create network  # Название шага (просто для читаемости)
        run: docker network create test-net  # Создаёт изолированную Docker-сеть, чтобы контейнеры могли общаться друг с другом по имени
      
      - name: Run SSH server  # Название шага
        run: |  # Многострочная команда
          docker build -t server ./exams/exam3  # Собирает Docker-образ из Dockerfile, который лежит в папке exams/exam3, и называет его "server"
          docker run -d --name server --network test-net server  # Запускает контейнер из образа server: -d (в фоне), --name (называет его server), --network (подключает к созданной сети)
          sleep 5  # Ждёт 5 секунд, чтобы SSH-сервер внутри контейнера успел запуститься
      
      - name: Run client and connect  # Название шага
        run: |  # Многострочная команда
          docker build -t client ./client  # Собирает Docker-образ для клиента из папки ./client (где лежит его Dockerfile)
          docker run --rm --network test-net client \  # Запускает контейнер из образа client: --rm (удалить после выполнения), --network (подключает к той же сети)
            sh -c "sshpass -p 'exam2026' ssh -o StrictHostKeyChecking=no student@server 'echo Connected'"  # Внутри контейнера выполняет: sshpass (вводит пароль), ssh (подключается к контейнеру server под пользователем student), выполняет команду 'echo Connected'
      
      - name: Cleanup  # Название шага
        if: always()  # Выполняется всегда, даже если предыдущие шаги завершились ошибкой
        run: |  # Многострочная команда
          docker stop server || true  # Останавливает контейнер server (|| true игнорирует ошибку, если контейнер уже остановлен)
          docker rm server || true  # Удаляет контейнер server
          docker network rm test-net || true  # Удаляет Docker-сеть test-net